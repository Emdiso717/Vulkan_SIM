android {
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "../../../../../bin/" + outputFileName
        }
    }
}

// Delete existing APK in bin/ before packaging so the packager creates a fresh zip
// (otherwise "already contains entry ... cannot overwrite" on incremental build)
tasks.whenTaskAdded { task ->
    if (task.name == "packageRelease" || task.name == "packageDebug") {
        task.doFirst {
            def apkName = task.project.name + (task.name.contains("Release") ? "-release.apk" : "-debug.apk")
            def binDir = task.project.file("../../bin")
            def f = new File(binDir, apkName)
            if (f.exists()) f.delete()
        }
    }
}