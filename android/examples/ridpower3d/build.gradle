apply plugin: 'com.android.application'
apply from: '../gradle/outputfilename.gradle'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "de.saschawillems.ridpower3d"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters rootProject.ext.abiFilters
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared", '-DANDROID_TOOLCHAIN=clang', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    // This sample reuses the project's common NativeActivity wrapper.
    sourceSets {
            main.assets.srcDirs = ['assets']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

// Assets are generated by copyTask.  Start from an empty shader directory so
// an incremental build cannot retain resources from another measurement app.
task cleanGeneratedShaderAssets(type: Delete) {
    delete 'assets/shaders/glsl'
}

task copyTask {
    copy {
        from '../../common/res/drawable'
        into "src/main/res/drawable"
        include 'icon.png'
    }

    copy {
        from rootProject.ext.shaderPath + 'glsl/base'
        into 'assets/shaders/glsl/base'
        include '*.spv'
    }

    copy {
        from rootProject.ext.shaderPath + 'glsl/riddfmb3d'
        into 'assets/shaders/glsl/riddfmb3d'
        include '*.spv'
    }

    copy {
        from rootProject.ext.assetPath + 'models'
        into 'assets/models'
    }

    copy {
        from rootProject.ext.assetPath + 'configs'
        into 'assets/configs'
        include 'solver_comparison.json'
    }
}

preBuild.dependsOn copyTask
